<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Virtual: Selección y Análisis de Hormas 3D (IBV)</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #004d40;
            color: white;
            padding: 20px;
            text-align: center;
        }
        #container {
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            min-height: 70vh;
        }
        #controls {
            width: 300px;
            padding: 20px;
            border-right: 1px solid #ddd;
        }
        #viewer-3d {
            flex-grow: 1;
            height: 700px;
            background-color: #e0e0e0; /* Fondo gris claro para el visor */
        }
        #infoHorma {
            margin-top: 30px;
            padding: 15px;
            background-color: #e8f5e9;
            border-radius: 5px;
            border-left: 5px solid #004d40;
        }
        #infoHorma ul {
            list-style: none;
            padding: 0;
        }
        #infoHorma li {
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        select, button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
</head>
<body>

    <header>
        <h1>Aula Virtual de Patronaje Biomecánico 👟</h1>
        <p>Selecciona una horma para ver sus parámetros IBV y visualización 3D.</p>
    </header>

    <div id="container">
        <aside id="controls">
            
            <label for="selectorHormas">Seleccionar Horma 3D:</label>
            <select id="selectorHormas" onchange="seleccionarHorma(this.value)">
                <option value="">Cargando catálogo...</option>
            </select>
            
            <button onclick="iniciarAnalisisGemini()" style="background-color: #ff9800; color: white;">
                Iniciar Análisis de Patrón (Gemini)
            </button>

            <div id="infoHorma">
                <h3>Parámetros Biomecánicos (IBV)</h3>
                <p>Selecciona una horma del menú superior para cargar sus datos técnicos y de diseño según las recomendaciones biomecánicas.</p>
            </div>
            
        </aside>

        <main id="viewer-3d">
            </main>
    </div>

    <script>
        
        // ----------------------------------------------------------------------
        // CONFIGURACIÓN Y RUTAS DE GITHUB
        // ----------------------------------------------------------------------

        // IMPORTANTE: Asegúrate de que esta URL apunta al archivo JSON en tu rama principal
        const GITHUB_USER = 'Migue420';
        const GITHUB_REPO = 'arpiedi-tienda-online';
        const GITHUB_BRANCH = 'main'; // O 'master' si usas esa rama
        
        const BASE_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/`;
        const CATALOG_URL = BASE_URL + 'data/conocimiento.json';
        
        let catalogoHormas = []; // Almacenará todos los datos del JSON
        let scene, camera, renderer, currentMesh; // Variables globales para Three.js

        // ----------------------------------------------------------------------
        // 1. CARGA EL CATÁLOGO DE HORMAS AL INICIO
        // ----------------------------------------------------------------------

        document.addEventListener('DOMContentLoaded', () => {
            initThreeJs(); // Inicializa el entorno 3D antes de cargar datos
            cargarCatalogo();
        });

        async function cargarCatalogo() {
            try {
                const response = await fetch(CATALOG_URL);
                if (!response.ok) {
                    throw new Error(`Error HTTP ${response.status}: Revise la ruta del archivo JSON en GitHub.`);
                }
                catalogoHormas = await response.json();
                
                const selector = document.getElementById('selectorHormas');
                selector.innerHTML = '<option value="">-- Elige una horma --</option>';

                // Llena el selector con las opciones del JSON
                catalogoHormas.forEach(horma => {
                    const option = document.createElement('option');
                    option.value = horma.id;
                    option.textContent = horma.nombre;
                    selector.appendChild(option);
                });

            } catch (error) {
                console.error('Fallo crítico al cargar el catálogo:', error);
                document.getElementById('selectorHormas').innerHTML = '<option value="">ERROR AL CARGAR (Revise URL)</option>';
            }
        }

        // ----------------------------------------------------------------------
        // 2. FUNCIÓN DE SELECCIÓN, CARGA 3D Y MOSTRAR PARÁMETROS
        // ----------------------------------------------------------------------

        function seleccionarHorma(hormaId) {
            if (!hormaId) {
                document.getElementById('infoHorma').innerHTML = '<h3>Parámetros Biomecánicos (IBV)</h3><p>Selecciona una horma para ver sus datos.</p>';
                limpiarVisor();
                return;
            }

            const hormaSeleccionada = catalogoHormas.find(h => h.id === hormaId);

            if (hormaSeleccionada) {
                const stlUrl = BASE_URL + hormaSeleccionada.archivo_stl;
                
                // Carga del STL
                cargarSTL(stlUrl); 
                
                // Muestra los parámetros biomecánicos
                mostrarParametrosIBV(hormaSeleccionada);
            }
        }

        function mostrarParametrosIBV(horma) {
            const params = horma.parametros_ibv;
            const infoDiv = document.getElementById('infoHorma');
            let html = `
                <h3>Parámetros IBV (Modelo: ${horma.talla})</h3>
                <p><strong>Estilo:</strong> ${horma.estilo}</p>
                <ul>
                    <li>Longitud Calzable: <strong>${params.longitud_calzable_mm} mm</strong></li>
                    <li>Perímetro Articulación: <strong>${params.perimetro_articulacion_mm} mm</strong></li>
                    <li>Altura Mínima Puntera: ${params.altura_min_puntera_mm} mm (Mínima recomendada)</li>
                    <li>Ángulo Mínimo Puntera: ${params.angulo_min_puntera_grados}°</li>
                    <li>Altura Flanco Interior: ${params.altura_flanco_int_mm} mm</li>
                </ul>
                <p style="color: #004d40;">**Guía Gemini:** ${horma.comentarios_gemini}</p>
            `;
            infoDiv.innerHTML = html;
        }
        
        // ----------------------------------------------------------------------
        // 3. FUNCIONES BÁSICAS DE THREE.JS (Visor 3D)
        // ----------------------------------------------------------------------

        function initThreeJs() {
            // Configuración de la escena, cámara y renderizador
            const container = document.getElementById('viewer-3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);
            
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // Luces
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(100, 100, 100);
            scene.add(directionalLight);

            // Control de órbita (necesitarás OrbitControls.js para esto en un entorno real)
            // Asumiendo que ya tienes una función para la interactividad de giro (entre 60°)

            // Animación
            function animate() {
                requestAnimationFrame(animate);
                // Si la horma existe, puedes rotarla o permitir el control del usuario
                if (currentMesh) {
                    // Por ejemplo: currentMesh.rotation.y += 0.005;
                }
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            const container = document.getElementById('viewer-3d');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }
        
        function limpiarVisor() {
            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh = null;
            }
        }

        function cargarSTL(url) {
            limpiarVisor();

            const loader = new THREE.STLLoader();
            loader.load(url, function (geometry) {
                const material = new THREE.MeshPhongMaterial({ color: 0xaaaaaa, specular: 0x111111, shininess: 200 });
                currentMesh = new THREE.Mesh(geometry, material);

                // Centrar y escalar la horma
                geometry.computeBoundingBox();
                const center = geometry.boundingBox.getCenter(new THREE.Vector3());
                const size = geometry.boundingBox.getSize(new THREE.Vector3());
                
                // Escala simple para que quepa en la vista
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 50 / maxDim; // Ajusta el factor de 50 para tu escena
                
                currentMesh.scale.set(scale, scale, scale);
                currentMesh.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
                
                scene.add(currentMesh);
            }, 
            (xhr) => {
                // Progreso de carga
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            (error) => {
                console.error('Error al cargar el STL:', error);
                document.getElementById('viewer-3d').innerHTML = '<p style="color:red;text-align:center;padding:20px;">Error al cargar el modelo 3D. Verifique la ruta del archivo STL en GitHub.</p>';
            });
        }
        
        // Función para el futuro módulo Gemini
        function iniciarAnalisisGemini() {
            alert('Función futura: Aquí se activará la API de Gemini para que el usuario suba su patrón 2D y lo compare con los parámetros IBV cargados.');
            // Aquí llamarías a la API de Gemini con los parámetros de la horma y la imagen del patrón
        }

    </script>
</body>
</html>
